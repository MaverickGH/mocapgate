name: public-windows-native-check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check published native package integrity
        run: python/python.exe -B scripts/native_packaging.py check .
      - name: Test bundled runtime and public integrations
        run: python/python.exe -B -m unittest discover tests

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoCapGate Studio</title>
<style>
  :root { --bg: #151619; --panel: #1c1e21; --line: #34363a; --text: #ededed; --muted: #a2a4a8; --accent: #5cc3cf; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { height: 100%; display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box; }
  .logo { width: 96px; height: 96px; margin: 0 auto 20px; background: url("icon.png") center / contain no-repeat;
    filter: drop-shadow(0 8px 24px rgba(0, 0, 0, .45)); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .92 } 50% { transform: scale(1.04); opacity: 1 } }
  h1 { margin: 0; font-size: 20px; font-weight: 600; } h1 span { color: var(--muted); font-weight: 400; }
  .status { color: var(--muted); margin: 6px 0 0; }
  .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin: 0 3px;
    vertical-align: middle; animation: b 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s } .dot:nth-child(3) { animation-delay: .4s }
  @keyframes b { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }
  #error { display: none; max-width: 580px; text-align: left; }
  #error h2 { font-size: 17px; font-weight: 600; margin: 0 0 10px; }
  #error pre { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); padding: 12px; border-radius: 6px;
    font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #error p { color: var(--muted); } #error a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div>
    <div class="logo" aria-hidden="true"></div>
    <div id="loading"><h1>MoCapGate <span>Studio</span></h1>
      <p class="status">Запуск · Starting <span class="dot"></span><span class="dot"></span><span class="dot"></span></p></div>
    <div id="error">
      <h2>MoCapGate Studio не запустилась · could not start</h2>
      <pre id="error-text"></pre>
      <p>Нужен <a href="https://www.python.org/downloads/" target="_blank" rel="noopener">Python 3.9+</a>
        (Studio needs Python 3.9+). Если он установлен в необычном месте — задайте MOCAPGATE_PYTHON и перезапустите.
        Подробнее: <a href="https://github.com/MaverickGH/mocapgate/blob/main/docs/install.md" target="_blank" rel="noopener">установка</a>.</p>
    </div>
  </div>
</main>
<script>
  window.showError = (text) => {
    document.getElementById("loading").style.display = "none";
    document.getElementById("error").style.display = "block";
    document.getElementById("error-text").textContent = text;
  };
</script>
</body>
</html>
